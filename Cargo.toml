[package]
name = "warmer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "warmer"
path = "src/main.rs"

[[bin]]
name = "warmerd"
path = "src/bin/warmerd.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "sync", "time", "fs"] }
